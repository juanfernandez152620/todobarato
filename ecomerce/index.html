<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Todo Barato · Celulares en cuotas sin interés</title>
  <meta name="description" content="Celulares en hasta 12 cuotas sin interés. Mirá el video de cada equipo y pedilo por WhatsApp.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
  <!-- Vista previa al compartir el link por WhatsApp o Facebook. Falta subir ../media/og.jpg (1200×630). -->
  <meta property="og:title" content="Todo Barato · Tu equipo nuevo está a solo un click">
  <meta property="og:description" content="Celulares en hasta 12 cuotas sin interés. Pedilo por WhatsApp.">
  <meta property="og:image" content="../media/og.jpg">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23fff000'/%3E%3Ctext x='31' y='43' font-family='Arial Black,Arial' font-weight='900' font-size='31' text-anchor='middle' fill='%230b0b0c'%3Etb%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400..700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <p class="promo" id="promo" aria-live="polite"></p>

  <header class="head">
    <a class="logo js-home" href="./" aria-label="Inicio">
      <span class="tb" aria-hidden="true">tb</span>
      <span class="logo-text" data-store="name"></span>
    </a>
    <nav class="nav" id="nav" aria-label="Categorías"></nav>
    <a class="head-wa js-wa js-wa-general" data-icon="wa" target="_blank" rel="noopener" aria-label="Escribinos por WhatsApp"><span>WhatsApp</span></a>
  </header>

  <main>
    <!-- Inicio: portada, marcas, catálogo y recomendados -->
    <div id="home">
      <section class="hero">
        <div class="hero-media" id="hero-media"></div>
        <div class="hero-copy">
          <p class="hero-kicker" id="hero-kicker"></p>
          <h1 class="hero-title">Tu equipo nuevo<br>está a solo un click</h1>
          <p class="hero-text" id="hero-text"></p>
          <div class="hero-ctas">
            <a class="btn-pill js-catalog" href="#catalogo">Ver celulares</a>
            <button class="btn-pill ghost js-shorts-all" type="button">Mirá los videos</button>
          </div>
        </div>
      </section>

      <section class="section">
        <h2 class="sec-title">Comprá por marca</h2>
        <div class="brand-row" id="brand-row"></div>
      </section>

      <section class="plp" id="catalogo">
        <div class="plp-head">
          <h2 class="plp-title"><span id="plp-title">Celulares</span> <span class="count" id="plp-count"></span></h2>
          <div class="plp-tools">
            <button class="tool js-filters" type="button" aria-controls="filters" aria-expanded="true">
              <span class="t-desk">Ocultar filtros</span><span class="t-mob">Filtrar</span><span data-icon="filter"></span>
            </button>
            <label class="tool sort">
              <span>Ordenar por</span>
              <select id="sort">
                <option value="destacados">Destacados</option>
                <option value="menor">Menor cuota</option>
                <option value="mayor">Mayor cuota</option>
                <option value="memoria">Más memoria</option>
              </select>
            </label>
          </div>
        </div>
        <div class="plp-body">
          <aside class="filters" id="filters" aria-label="Filtros">
            <div class="filters-head">
              <b>Filtrar</b>
              <button class="icon-btn js-sheet-close" type="button" aria-label="Cerrar filtros" data-icon="close"></button>
            </div>
            <div id="filter-groups"></div>
            <div class="filters-foot">
              <button class="btn-pill ghost js-clear" type="button">Borrar</button>
              <button class="btn-pill js-sheet-close js-apply" type="button">Ver resultados</button>
            </div>
          </aside>
          <div class="grid" id="grid"></div>
        </div>
      </section>

      <section class="recs" id="recs-home"></section>
    </div>

    <!-- Página de producto -->
    <div id="product" hidden></div>
  </main>

  <footer class="foot">
    <div class="foot-brand">
      <span class="tb" aria-hidden="true">tb</span>
      <div><b data-store="name"></b><span>📍 <span data-store="city"></span></span></div>
    </div>
    <ul class="foot-links">
      <li><a class="js-wa js-wa-general" target="_blank" rel="noopener">Escribinos por WhatsApp</a></li>
      <li><span class="js-financing">Financiá con <span data-store="financing"></span></span></li>
      <li><a href="../red-social/">Ver el diseño "Red social"</a></li>
    </ul>
    <p class="foot-legal">© <span id="year"></span> <span data-store="name"></span> · <span data-store="city"></span></p>
  </footer>

  <a class="fab js-wa js-wa-general" data-icon="wa" target="_blank" rel="noopener" aria-label="Escribinos por WhatsApp"></a>
  <div class="scrim" id="scrim" hidden></div>

  <!-- Modo video: pantalla completa, un celular por pantalla, deslizar para el siguiente -->
  <div class="shorts" id="shorts" role="dialog" aria-modal="true" aria-label="Videos de los celulares" hidden>
    <div class="shorts-stage">
      <button class="shorts-close js-close" id="shorts-close" type="button" aria-label="Cerrar" data-icon="close"></button>
      <div class="shorts-track" id="shorts-track"></div>
      <p class="shorts-hint" id="shorts-hint"></p>
    </div>
    <div class="shorts-nav">
      <button type="button" id="shorts-prev" aria-label="Anterior" data-icon="up"></button>
      <button type="button" id="shorts-next" aria-label="Siguiente" data-icon="down"></button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../shared/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
