<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Todo Barato · Celulares en cuotas en Tucumán</title>
  <meta name="description" content="Celulares en 9 o 12 cuotas. Mirá el video de cada equipo y pedilo por WhatsApp.">
  <meta name="theme-color" content="#f4f1e9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)">
  <!-- Vista previa al compartir el link por WhatsApp o Facebook. Falta subir img/og.jpg (1200×630). -->
  <meta property="og:title" content="Todo Barato · Tu equipo nuevo está a solo un click">
  <meta property="og:description" content="Celulares en 9 o 12 cuotas. Mirá el video de cada uno y pedilo por WhatsApp.">
  <meta property="og:image" content="img/og.jpg">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23fff000'/%3E%3Ctext x='31' y='43' font-family='Arial Black,Arial' font-weight='900' font-size='31' text-anchor='middle' fill='%230b0b0c'%3Etb%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,500..900;1,700..900&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="topbar">
    <span>Hasta 12 cuotas sin interés</span>
    <span class="dot opt2" aria-hidden="true">•</span>
    <span class="opt2 js-financing">Financiá con <span data-store="financing"></span></span>
    <span class="dot opt" aria-hidden="true">•</span>
    <span class="opt">Estamos en <span data-store="city"></span></span>
  </div>

  <header class="site-head">
    <a class="brand" href="./">
      <span class="tb-logo" aria-hidden="true"><b>tb</b></span>
      <span class="brand-text">
        <b class="wordmark"><span data-store="name"></span><sup data-store="tag"></sup></b>
        <small>📍 <span data-store="city"></span></small>
      </span>
    </a>
    <a class="head-wa js-wa js-wa-general" data-icon="wa" target="_blank" rel="noopener"><span>Escribinos</span></a>
  </header>

  <main>
    <section class="hero">
      <h1 class="hero-title"><span class="hl">Tu equipo nuevo</span> <em>está a solo un click</em></h1>
      <p class="hero-sub">Mirá los videos, elegí tus cuotas y pedilo por WhatsApp 👇</p>
      <!-- Banner: va pasando por todos los celulares -->
      <div class="hero-reel" id="hero-reel"></div>
    </section>

    <nav class="stories-row" id="stories" aria-label="Marcas"></nav>

    <section class="filters" aria-label="Filtrar por cuota">
      <p class="filters-label">¿Cuánto querés pagar por mes? <span>(en 12 cuotas)</span></p>
      <div class="chips" id="chips"></div>
    </section>

    <div class="feed" id="feed"></div>
    <div id="sentinel" aria-hidden="true"></div>
  </main>

  <a class="fab js-wa js-wa-general" data-icon="wa" target="_blank" rel="noopener" aria-label="Escribinos por WhatsApp"></a>

  <!-- Modo "shorts": pantalla completa, un celular por pantalla, deslizar para el siguiente -->
  <div class="shorts" id="shorts" role="dialog" aria-modal="true" aria-label="Videos de los celulares" hidden>
    <div class="shorts-stage">
      <button class="shorts-close js-close" id="shorts-close" type="button" aria-label="Cerrar" data-icon="close"></button>
      <div class="shorts-track" id="shorts-track"></div>
      <p class="shorts-hint" id="shorts-hint"></p>
    </div>
    <div class="shorts-nav">
      <button type="button" id="shorts-prev" aria-label="Anterior" data-icon="up"></button>
      <button type="button" id="shorts-next" aria-label="Siguiente" data-icon="down"></button>
    </div>
  </div>

  <!-- Historia "Cómo comprar" -->
  <div class="story" id="story" role="dialog" aria-modal="true" aria-label="Cómo comprar" hidden>
    <div class="story-stage" id="story-stage">
      <div class="segs" id="story-segs"></div>
      <button class="story-close js-close" id="story-close" type="button" aria-label="Cerrar" data-icon="close"></button>
      <button class="story-tap prev" id="story-prev" type="button" aria-label="Paso anterior"></button>
      <button class="story-tap next" id="story-next" type="button" aria-label="Paso siguiente"></button>
      <div class="story-body" id="story-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../shared/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
